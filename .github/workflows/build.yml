name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      VERSION_CODE: ${{ github.run_number }}
      # Adresa servera: GitHub → Settings → Secrets and variables → Actions → Variables (ili podrazumevana u build.gradle.kts)
      ORBIT_SERVER_URL: ${{ vars.ORBIT_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Prikaz grešaka kompajliranja
        run: echo "::add-matcher::${{ github.workspace }}/.github/kotlin-matcher.json"

      - name: Potpisni ključ (ako je podešen)
        env:
          KEYSTORE_BASE64: ${{ secrets.ORBIT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ORBIT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ORBIT_KEYSTORE_BASE64 nije podešen — APK je potpisan test ključem."
          fi

      - name: APK (pro)
        env:
          ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD }}
          ORBIT_KEY_ALIAS: ${{ secrets.ORBIT_KEY_ALIAS }}
          ORBIT_KEY_PASSWORD: ${{ secrets.ORBIT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleProRelease

      - name: Imenovanje fajlova
        run: |
          VERSION=$(grep -oP 'val appVersionName = "\K[^"]+' app/build.gradle.kts)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p out
          for f in $(find app/build/outputs/apk -name "*.apk"); do
            flavor=$(echo "$f" | grep -oE '/(pro|lite)/' | tr -d '/')
            cp "$f" "out/orbit-${flavor}-${VERSION}-${VERSION_CODE}.apk"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: android/out/*.apk
          if-no-files-found: error

      # Poslednji build je uvek dostupan kao „latest-build” u Releases
      - name: Objava poslednjeg builda
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --cleanup-tag -y || true
          gh release create latest-build out/*.apk --prerelease \
            --title "Build ${VERSION_CODE} (${APP_VERSION})" \
            --notes "Automatski build iz commit-a ${GITHUB_SHA::7}."
