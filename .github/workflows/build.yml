name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# one build at a time, in order, so an older build never replaces a newer release
concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Show compiler errors
        run: echo "::add-matcher::${{ github.workspace }}/.github/kotlin-matcher.json"

      - name: Signing key (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.ORBIT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ORBIT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ORBIT_KEYSTORE_BASE64 is not set, the APK is signed with the test key."
          fi

      - name: Build APK
        env:
          ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD }}
          ORBIT_KEY_ALIAS: ${{ secrets.ORBIT_KEY_ALIAS }}
          ORBIT_KEY_PASSWORD: ${{ secrets.ORBIT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name files
        run: |
          # same rule as app/build.gradle.kts: major.minor from there, patch = builds since its first build
          MM=$(grep -oP 'val versionMajorMinor = "\K[^"]+' app/build.gradle.kts)
          FIRST=$(grep -oP 'val versionFirstBuild = \K[0-9]+' app/build.gradle.kts)
          PATCH=$(( VERSION_CODE - FIRST )); [ "$PATCH" -lt 0 ] && PATCH=0
          VERSION="${MM}.${PATCH}"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p out
          cp $(find app/build/outputs/apk/release -name "*.apk" | head -1) "out/orbit-player-${VERSION}-${VERSION_CODE}.apk"
          # same file under a name that never changes: a fixed download link to the newest build
          cp "out/orbit-player-${VERSION}-${VERSION_CODE}.apk" out/orbit-player.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: android/out/*.apk
          if-no-files-found: error

      # A build that waited in the queue while a newer commit was pushed must not cover the newer one
      - name: Is this the newest commit?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" -q .sha)
          if [ "$HEAD_SHA" = "$GITHUB_SHA" ]; then echo "NEWEST=true" >> "$GITHUB_ENV"; else echo "NEWEST=false" >> "$GITHUB_ENV"; echo "Not the newest commit ($HEAD_SHA): not published"; fi

      - name: Publish latest build
        if: env.NEWEST == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release notes = the commit message (shown in the app's update screen)
          git log -1 --pretty=%B | grep -v -e '^Co-Authored-By' -e '^Claude-Session' > "$RUNNER_TEMP/notes.txt"
          echo "Build ${VERSION_CODE}, commit ${GITHUB_SHA::7}." >> "$RUNNER_TEMP/notes.txt"
          TITLE="Build ${VERSION_CODE} (${APP_VERSION})"
          if gh release view latest-build >/dev/null 2>&1; then
            # never leave the release empty (the app may be downloading): new files first, then remove the old ones
            OLD=$(gh release view latest-build --json assets -q '.assets[].name')
            gh release upload latest-build out/*.apk --clobber
            NEW=" $(cd out && ls *.apk | tr '\n' ' ') "
            for a in $OLD; do
              case "$NEW" in *" $a "*) ;; *) gh release delete-asset latest-build "$a" -y || true ;; esac
            done
            gh release edit latest-build --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.txt"
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest-build" -f sha="$GITHUB_SHA" -F force=true >/dev/null || true
          else
            gh release create latest-build out/*.apk --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.txt"
          fi

      # Backup source for updates: the same APK on the "apk" branch, served by raw.githubusercontent.com
      # (another GitHub network than release downloads, which sometimes answer 504). One commit, force-pushed.
      - name: Backup copy for updates
        if: env.NEWEST == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B="$RUNNER_TEMP/apk-branch"
          rm -rf "$B" && mkdir -p "$B"
          APK="orbit-player-${APP_VERSION}-${VERSION_CODE}.apk"
          cp "out/$APK" "$B/"
          python3 - "$B/latest.json" "$APK" "$APP_VERSION" "$VERSION_CODE" "$(stat -c %s "out/$APK")" "$RUNNER_TEMP/notes.txt" <<'EOF'
          import json, sys, datetime
          out, name, ver, code, size, notes = sys.argv[1:]
          json.dump({"name": name, "versionName": ver, "versionCode": int(code), "size": int(size),
                     "notes": open(notes).read().strip(), "date": datetime.date.today().isoformat()}, open(out, "w"))
          EOF
          cd "$B"
          git init -q -b apk
          git add .
          git -c user.name="Orbit Dev" -c user.email="orbit-dev@users.noreply.github.com" commit -qm "Build ${VERSION_CODE}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk

      # Screenshots of the main screens (TV and phone) rendered with test data
      - name: Screenshots
        continue-on-error: true
        run: ./gradlew --no-daemon recordRoborazziDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ github.run_number }}
          path: android/app/build/outputs/roborazzi/*.png
          if-no-files-found: ignore

      - name: Publish screenshots
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls app/build/outputs/roborazzi/ || exit 0
          touch app/build/outputs/roborazzi/nav-log.txt
          gh release delete screenshots --cleanup-tag -y || true
          gh release create screenshots app/build/outputs/roborazzi/*.png app/build/outputs/roborazzi/*.txt --prerelease \
            --title "Screenshots ${VERSION_CODE}" --notes "Rendered with test data from commit ${GITHUB_SHA::7}."
