name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      VERSION_CODE: ${{ github.run_number }}
      # Adresa servera se podešava u GitHub → Settings → Secrets and variables → Actions → Variables
      ORBIT_SERVER_URL: ${{ vars.ORBIT_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Prikaz grešaka kompajliranja
        run: echo "::add-matcher::${{ github.workspace }}/.github/kotlin-matcher.json"

      - name: Potpisni ključ (ako je podešen)
        env:
          KEYSTORE_BASE64: ${{ secrets.ORBIT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ORBIT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ORBIT_KEYSTORE_BASE64 nije podešen — release APK je potpisan debug ključem (samo za testiranje)."
          fi

      - name: Debug APK (pro i lite)
        run: ./gradlew --no-daemon assembleProDebug assembleLiteDebug

      - name: Release APK (pro i lite)
        id: release
        continue-on-error: true
        env:
          ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD }}
          ORBIT_KEY_ALIAS: ${{ secrets.ORBIT_KEY_ALIAS }}
          ORBIT_KEY_PASSWORD: ${{ secrets.ORBIT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleProRelease assembleLiteRelease

      - name: Imenovanje fajlova
        run: |
          VERSION=$(grep -oP 'val appVersionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          for f in $(find app/build/outputs/apk -name "*.apk"); do
            flavor=$(echo "$f" | grep -oE '/(pro|lite)/' | tr -d '/')
            type=$(echo "$f" | grep -oE '/(debug|release)/' | tr -d '/')
            suffix=""; [ "$type" = "debug" ] && suffix="-debug"
            cp "$f" "out/orbit-${flavor}-${VERSION}-${VERSION_CODE}${suffix}.apk"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: android/out/*.apk
          if-no-files-found: error
